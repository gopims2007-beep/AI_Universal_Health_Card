<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient Registration</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
      }

      .header {
        height: 60px;
        background: #0d6efd;
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8%;
      }

      .logo {
        font-size: 21px;
        font-weight: bold;
      }

      .home-btn {
        background: white;
        color: #0d6efd;
        border: none;
        padding: 9px 16px;
        border-radius: 5px;
        cursor: pointer;
      }

      .container {
        width: 90%;
        max-width: 650px;
        margin: 45px auto;
      }

      .card {
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;
        color: #172b4d;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccd3dd;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #0d6efd;
      }

      .row {
        display: flex;
        gap: 15px;
      }

      .row .form-group {
        flex: 1;
      }

      .register-btn {
        width: 100%;
        padding: 13px;
        background: #0d6efd;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      .register-btn:hover {
        background: #0b5ed7;
      }

      .register-btn:disabled {
        background: #8ab4f8;
        cursor: not-allowed;
      }

      .message {
        display: none;
        margin-top: 18px;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
      }

      .login-text {
        text-align: center;
        margin-top: 20px;
        color: #666;
      }

      .login-text a {
        color: #0d6efd;
        font-weight: bold;
        text-decoration: none;
      }

      @media (max-width: 600px) {
        .row {
          flex-direction: column;
          gap: 0;
        }

        .card {
          padding: 25px;
        }
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="logo">AI Universal Health Card</div>

      <button class="home-btn" onclick="window.location.href = 'index.html'">
        Home
      </button>
    </header>

    <div class="container">
      <div class="card">
        <h1>Patient Registration</h1>

        <p class="subtitle">Create your Digital Health Card account</p>

        <form id="registrationForm">
          <!-- NAME -->
          <div class="form-group">
            <label for="name">Full Name</label>

            <input
              type="text"
              id="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <!-- DOB + GENDER -->
          <div class="row">
            <div class="form-group">
              <label for="dob">Date of Birth</label>

              <input type="date" id="dob" required />
            </div>

            <div class="form-group">
              <label for="gender">Gender</label>

              <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <!-- BLOOD GROUP -->
          <div class="form-group">
            <label for="bloodGroup">Blood Group</label>

            <select id="bloodGroup" required>
              <option value="">Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>

          <!-- MOBILE -->
          <div class="form-group">
            <label for="mobile">Mobile Number</label>

            <input
              type="tel"
              id="mobile"
              placeholder="Enter 10 digit mobile number"
              maxlength="10"
              pattern="[0-9]{10}"
              required
            />
          </div>

          <!-- EMAIL -->
          <div class="form-group">
            <label for="email">Email Address</label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- PASSWORD -->
          <div class="form-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              placeholder="Create password"
              minlength="6"
              required
            />
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="form-group">
            <label for="confirmPassword"> Confirm Password </label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm password"
              minlength="6"
              required
            />
          </div>

          <!-- REGISTER -->
          <button type="submit" class="register-btn" id="registerButton">
            Register
          </button>

          <div id="message" class="message"></div>
        </form>

        <div class="login-text">
          Already have an account?

          <a href="login.html"> Login </a>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("registrationForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const name = document.getElementById("name").value.trim();

          const dob = document.getElementById("dob").value;

          const gender = document.getElementById("gender").value;

          const bloodGroup = document.getElementById("bloodGroup").value;

          const mobile = document.getElementById("mobile").value.trim();

          const email = document.getElementById("email").value.trim();

          const password = document.getElementById("password").value;

          const confirmPassword =
            document.getElementById("confirmPassword").value;

          const message = document.getElementById("message");

          const registerButton = document.getElementById("registerButton");

          // Clear old message
          message.style.display = "none";

          // MOBILE VALIDATION
          if (!/^[0-9]{10}$/.test(mobile)) {
            message.style.display = "block";
            message.style.background = "#ffe5e5";
            message.style.color = "#b00020";

            message.innerText = "Please enter a valid 10 digit mobile number.";

            return;
          }

          // PASSWORD VALIDATION
          if (password.length < 6) {
            message.style.display = "block";
            message.style.background = "#ffe5e5";
            message.style.color = "#b00020";

            message.innerText = "Password must be at least 6 characters.";

            return;
          }

          // CONFIRM PASSWORD
          if (password !== confirmPassword) {
            message.style.display = "block";
            message.style.background = "#ffe5e5";
            message.style.color = "#b00020";

            message.innerText = "Passwords do not match.";

            return;
          }

          // Disable button while registering
          registerButton.disabled = true;
          registerButton.innerText = "Registering...";

          try {
            // SEND DATA TO BACKEND
            const response = await fetch("/api/auth/register", {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                email: email,
                password: password,
                full_name: name,
                phone: mobile,
                role: "patient",
              }),
            });

            // Read response
            const result = await response.json();

            // BACKEND ERROR
            if (!response.ok) {
              let errorMessage = "Registration failed.";

              if (result.detail) {
                if (typeof result.detail === "string") {
                  errorMessage = result.detail;
                } else {
                  errorMessage = JSON.stringify(result.detail);
                }
              }

              throw new Error(errorMessage);
            }

            // SAVE TOKEN IF BACKEND RETURNS IT
            if (result.access_token) {
              localStorage.setItem("access_token", result.access_token);
            }

            if (result.refresh_token) {
              localStorage.setItem("refresh_token", result.refresh_token);
            }

            // SAVE PATIENT INFORMATION LOCALLY
            const patient = {
              name: name,
              dob: dob,
              gender: gender,
              bloodGroup: bloodGroup,
              mobile: mobile,
              email: email,
            };

            localStorage.setItem("patientData", JSON.stringify(patient));

            // SUCCESS MESSAGE
            message.style.display = "block";
            message.style.background = "#d1e7dd";
            message.style.color = "#0f5132";

            message.innerText =
              "Registration successful! Redirecting to login...";

            // GO TO LOGIN
            setTimeout(function () {
              window.location.href = "login.html";
            }, 1500);
          } catch (error) {
            console.error("Registration error:", error);

            message.style.display = "block";
            message.style.background = "#ffe5e5";
            message.style.color = "#b00020";

            message.innerText =
              error.message || "Registration failed. Please try again.";

            registerButton.disabled = false;
            registerButton.innerText = "Register";
          }
        });
    </script>
  </body>
</html>
