<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Universal Health Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: white;
        overflow: hidden;
      }

      /* =========================
       HEADER
    ========================== */

      .header {
        width: 100%;
        height: 65px;

        background: #0d6efd;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 7%;

        position: relative;
        z-index: 10;
      }

      .logo {
        color: white;
        font-size: 22px;
        font-weight: bold;
      }

      .buttons {
        display: flex;
        gap: 10px;
      }

      button {
        cursor: pointer;
        font-size: 14px;
        border-radius: 6px;
        padding: 10px 18px;
      }

      .login-btn {
        background: white;
        color: #0d6efd;
        border: none;
      }

      .register-btn {
        background: transparent;
        color: white;
        border: 1px solid white;
      }

      .login-btn:hover {
        background: #eaf2ff;
      }

      .register-btn:hover {
        background: white;
        color: #0d6efd;
      }

      /* =========================
       HOSPITAL IMAGE
       FULL SCREEN
       NO WHITE SPACE
    ========================== */

      .hospital-section {
        width: 100%;
        height: calc(100vh - 65px);

        background-image: url("hospital.jpg");

        /* Full image area */
        background-size: 100% 100%;

        background-position: center;
        background-repeat: no-repeat;
      }

      /* =========================
       MOBILE
    ========================== */

      @media (max-width: 700px) {
        .header {
          height: 60px;
          padding: 0 5%;
        }

        .logo {
          font-size: 17px;
        }

        .buttons {
          gap: 6px;
        }

        button {
          padding: 8px 11px;
          font-size: 12px;
        }

        .hospital-section {
          width: 100%;
          height: calc(100vh - 60px);

          background-image: url("hospital.jpg");

          /* Mobile-லயும் full screen */
          background-size: 100% 100%;

          background-position: center;
          background-repeat: no-repeat;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
       HEADER
  ========================== -->

    <header class="header">
      <div class="logo">AI Universal Health Card</div>

      <div class="buttons">
        <button class="login-btn" onclick="goToLogin()">Login</button>

        <button class="register-btn" onclick="goToRegister()">Register</button>
      </div>
    </header>

    <!-- =========================
       HOSPITAL BACKGROUND
       NO TEXT OVER IMAGE
  ========================== -->

    <section class="hospital-section"></section>

    <!-- =========================
       JAVASCRIPT
  ========================== -->

    <script>
      function goToLogin() {
        window.location.href = "login.html";
      }

      function goToRegister() {
        window.location.href = "register.html";
      }
    </script>
  </body>
</html>
