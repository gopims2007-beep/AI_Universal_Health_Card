services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_health_card
      MYSQL_USER: healthapp
      MYSQL_PASSWORD: healthapp_password
      MYSQL_ROOT_PASSWORD: change_this_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uhealthapp", "-phealthapp_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
