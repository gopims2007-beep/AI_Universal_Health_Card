services:
  - type: web
    name: ai-universal-health-card
    runtime: python
    rootDir: ai_universal_health_card_real/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.13